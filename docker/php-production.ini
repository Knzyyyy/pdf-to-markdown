; =============================================================================
;  Konfigurasi PHP untuk produksi (container).
;  Di-load lewat /usr/local/etc/php/conf.d/zz-production.ini
;
;  Nilai-nilai di sini berlaku untuk CLI maupun Apache (mod_php).
; =============================================================================

; -----------------------------------------------------------------------------
; Batas upload
; -----------------------------------------------------------------------------
; Aplikasi menegakkan batas 15 MB di backend (ConvertPdfRequest).
; Nilai di bawah sengaja dibuat lebih besar dari 15 MB supaya PHP tidak
; menolak file lebih dulu sebelum masuk ke aplikasi.
;
; post_max_size WAJIB lebih besar dari upload_max_filesize, karena nilainya
; berlaku untuk seluruh body request termasuk multipart overhead.
upload_max_filesize = 16M
post_max_size = 20M
; Jumlah file per request. Aplikasi hanya menerima 1 file, jadi 1 cukup.
; Nilai 0 berarti "tanpa batas" dan berguna untuk debugging upload gagal.
max_file_uploads = 5

; -----------------------------------------------------------------------------
; Eksekusi
; -----------------------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60

; -----------------------------------------------------------------------------
; Output dan log
; -----------------------------------------------------------------------------
; Jangan pernah tampilkan error ke pengguna di produksi: isinya bisa membocorkan
; path server, nama kelas, atau potongan isi file.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Error ditulis ke stderr supaya terkumpul di log Platform
; (Render/Railway) dan terlihat di output `docker logs`.
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; -----------------------------------------------------------------------------
; Keamanan
; -----------------------------------------------------------------------------
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

date.timezone = UTC

; -----------------------------------------------------------------------------
; Session
; -----------------------------------------------------------------------------
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; session.cookie_secure SENGAJA TIDAK ditulis di file ini.
;
; Nilainya bergantung pada apakah situsnya memakai HTTPS:
;   1 -> cookie hanya dikirim lewat HTTPS. Ini yang benar untuk Render/Railway.
;   0 -> cookie juga dikirim lewat HTTP biasa. WAJIB untuk pengujian lokal
;        lewat http://localhost, kalau tidak session tidak akan berjalan.
;
; Nilai di-set oleh docker/entrypoint.sh dari environment variable
; SESSION_SECURE_COOKIE setiap kali container start, karena php.ini tidak
; bisa membaca environment variable secara langsung.
;
; Kalau file ini dijalankan di luar container, tambahkan sendiri nilainya di
; bawah, karena tanpa itu cookie tidak akan ditandai secure.

; -----------------------------------------------------------------------------
; Opcache
; -----------------------------------------------------------------------------
; validate_timestamps = 0 karena kode di dalam image tidak berubah saat
; container berjalan. Kalau kamu mengubah kode, build ulang image-nya.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; -----------------------------------------------------------------------------
; Realpath cache (mempercepat resolusi path)
; -----------------------------------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600
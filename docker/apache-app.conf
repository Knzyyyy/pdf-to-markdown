# =============================================================================
#  Log Apache diarahkan ke stdout/stderr.
#
#  Tanpa ini, log hanya masuk ke file di dalam container dan tidak pernah
#  terlihat di dashboard Render/Railway maupun di `docker logs`.
# =============================================================================

ErrorLog /dev/stderr

# "combined" sudah FormatStandar yang diaktifkan image resmi php:apache,
# jadi tidak perlu didefinisikan ulang di sini.
CustomLog /dev/stdout combined
name: Tests

# Workflow ini menjalankan test otomatis setiap kali ada push atau Pull Request.
# Tujuannya: kalau ada yang rusak, ketahuan sebelum kode masuk ke branch utama.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

# Batalkan eksekusi lama kalau ada commit baru (hemat kuota runner).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Composer ${{ matrix.composer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      # Gagal kalau salah satu kombinasi gagal.
      fail-fast: false
      matrix:
        # Minimum proyek adalah PHP 8.2 (lihat "php" di composer.json).
        # PHP 8.1 TIDAK lagi diuji karena composer.lock memuat beberapa
        # package yang butuh >= 8.2, seperti symfony/string, symfony/yaml,
        # symfony/css-selector, symfony/event-dispatcher 7.3, dan
        # laravel/pint 1.25.
        php: ['8.2', '8.3']
        composer: ['prefer-dist']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        # Major tetap v2, jadi tag "@v2" saja tidak cukup jelas.
        # Runtime node24 baru ikut di build 2.40.0, jadi versinya dipin
        # eksplisit supaya node24 tidak bergantung pada isi tag bergerak.
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          # ext-zip WAJIB: fiturnya ada di require composer.json, jadi
          # tanpa extension ini `composer install` akan gagal.
          extensions: zip, mbstring, dom, fileinfo, iconv, zlib
          coverage: none
          tools: composer:v2

      - name: Validasi composer.json
        run: composer validate --strict

      - name: Install dependency PHP
        run: composer install --no-interaction --no-progress --prefer-dist

      # Tanpa APP_KEY, session dan cookie enkripsi tidak bisa dipakai dan
      # hampir semua test fitur akan gagal.
      - name: Siapkan file .env untuk testing
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependency Node
        run: npm ci

      # Penting: halaman memakai @vite, jadi manifest harus ada. Tanpa
      # langkah ini, semua test fitur akan gagal dengan error 500.
      - name: Build asset frontend
        run: npm run build

      - name: Jalankan test
        run: php artisan test

      - name: Cek format kode
        if: matrix.php == '8.3'
        run: vendor/bin/pint --test

      - name: Pastikan tidak ada secret yang ikut ter-commit
        if: matrix.php == '8.3'
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::File .env ikut ter-commit. Hapus dari repository."
            exit 1
          fi
          echo "Aman: .env tidak ter-commit."

  # ---------------------------------------------------------------------------
  # Smoke test image Docker: build, jalankan, lalu pastikan halamannya terbuka.
  #
  # Job ini menangkap masalah yang TIDAK bisa ditangkap test PHP biasa, misalnya
  # extension yang lupa dipasang, DocumentRoot yang salah, atau container yang
  # tidak mau start karena APP_KEY kosong.
  #
  # Berjalan setelah job tests hijau, karena membangun image lebih mahal.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build dan smoke test
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Tampilkan versi Docker
        run: docker version

      - name: Build image
        run: docker build -t pdf-to-markdown .

      # APP_KEY harus berbentuk base64: + 32 byte acak. Container akan gagal
      # start kalau kosong, dan itu memang perilaku yang diinginkan.
      - name: Siapkan APP_KEY
        run: echo "APP_KEY=base64:$(head -c 32 /dev/urandom | base64)" >> "$GITHUB_ENV"

      - name: Jalankan container
        run: |
          docker run -d \
            --name pdf-md-smoke \
            -p 8080:8080 \
            -e APP_KEY="${APP_KEY}" \
            -e PORT=8080 \
            -e SESSION_SECURE_COOKIE=0 \
            pdf-to-markdown

# Entry container melakukan 7 perintah artisan (package:discover,
      # config:clear/cache, route:clear/cache, view:clear/cache) sebelum
      # Apache benar-benar listen. Selama masa itu port sudah dipetakan tapi
      # belum ada yang mendengarkan, sehingga koneksi bisa berakhir sebagai
      # "connection refused" (curl 7) ATAU "connection reset by peer" (curl 56)
      # tergantung cara Docker memetakan portnya.
      #
      # --retry-all-errors wajib dipakai, bukan hanya --retry-connrefused:
      # dengan flag yang lama, curl berhenti di percobaan pertama saat
      # jawabannya 56, padahal Apache sebenarnya belum siap.
      #
      # --fail membuat HTTP 4xx/5xx dianggap gagal, bukan sukses diam-diam.
      - name: Pastikan halaman converter terbuka
        run: |
          curl --fail \
               --retry 15 \
               --retry-delay 2 \
               --retry-all-errors \
               --connect-timeout 5 \
               http://localhost:8080/pdf-to-markdown \
               --output /tmp/page.html

          # HTTP 200 saja belum cukup: cek isi halamannya bener-bener
          # render form converter.
          grep -q "Unggah dokumen" /tmp/page.html || {
            echo "::error::Halaman terbuka tapi tidak memuat form converter."
            exit 1;
          }

          # Catatan: route() di Laravel menghasilkan URL ABSOLUT, jadi nilainya
          # bisa "http://localhost/pdf-to-markdown" maupun "/pdf-to-markdown".
          # Karena itu pola di bawah tidak memaksa bentuk tertentu.
          grep -q 'action="[^"]*/pdf-to-markdown"' /tmp/page.html || {
            echo "::error::Form upload tidak mengarah ke /pdf-to-markdown."
            exit 1;
          }

          # Form harus punya CSRF token dan multipart, kalau tidak upload
          # pasti ditolak.
          grep -q 'name="_token"' /tmp/page.html || {
            echo "::error::Form upload tidak punya token CSRF."
            exit 1;
          }
          grep -q 'enctype="multipart/form-data"' /tmp/page.html || {
            echo "::error::Form bukan multipart, file tidak akan terkirim."
            exit 1;
          }

          echo "OK: halaman converter merespons 200 dan berisi form upload."

      # Kalau smoke test gagal, penyebabnya hampir selalu ada di log container
# (entrypoint, config:cache, atau Apache yang tidak mau start).
      # Langkah ini yang membuatnya terlihat, jadi JANGAN dihapus.
      #
      # Diagnosis sengaja memakai "set +e" dan menambahkan || true di setiap
      # perintah: kalau satu pemeriksaan gagal, pemeriksaan lain tetap jalan.
      # Langkah diagnostik yang ikut gagal hanya akan menyembunyikan informasi.
      - name: Diagnosis kegagalan container
        if: failure()
        env:
          CONTAINER: pdf-md-smoke
        run: |
          set +e

          echo "::group::Status container"
          docker ps -a --filter "name=${CONTAINER}" || true
          docker ps -a || true
          docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' \
            "${CONTAINER}" || echo "Container tidak ada (mungkin gagal sebelum dibuat)"
          RUNNING="$(docker inspect --format '{{.State.Running}}' "${CONTAINER}" 2>/dev/null)"
          echo "running=${RUNNING}"
          echo "::endgroup::"

          echo "::group::Log container (docker logs)"
          docker logs "${CONTAINER}" 2>&1 || echo "Log tidak bisa dibaca"
          echo "::endgroup::"

          # Membaca berkas dari DALAM container. Kalau container sudah berhenti,
          # docker exec tidak bisa dipakai, jadi dipakai docker cp.
          # Argumen: <path di dalam container> <label> [jumlah baris terakhir]
          #
          # tail dilakukan DI DALAM container supaya log yang besar tidak
          # ikut tertransfer ke runner.
          baca_berkas() {
            path="$1"
            label="$2"
            max="${3:-0}"
            tmp="$(mktemp)"

            if [ "${RUNNING}" = "true" ]; then
              if [ "${max}" -gt 0 ]; then
                docker exec "${CONTAINER}" sh -c "test -f ${path} && tail -n ${max} ${path} || echo '${label} TIDAK ADA'" 2>/dev/null
              else
                docker exec "${CONTAINER}" sh -c "test -f ${path} && cat ${path} || echo '${label} TIDAK ADA'" 2>/dev/null
              fi
            elif docker cp "${CONTAINER}:${path}" "${tmp}" 2>/dev/null; then
              if [ "${max}" -gt 0 ]; then
                tail -n "${max}" "${tmp}"
              else
                cat "${tmp}"
              fi
            else
              echo "${label} TIDAK ADA"
            fi

            rm -f "${tmp}"
          }

          echo "::group::laravel.log (80 baris terakhir)"
          baca_berkas /var/www/html/storage/logs/laravel.log 'laravel.log' 80
          echo "::endgroup::"

          echo "::group::Vite manifest"
          manifest="$(baca_berkas /var/www/html/public/build/manifest.json 'manifest.json')"
          echo "${manifest}"
          if [ "${manifest}" = "manifest.json TIDAK ADA" ]; then
            echo "::error::manifest.json tidak ada di dalam image."
            echo "::error::Halaman balas HTTP 500 karena @vite() tidak bisa menemukan manifest."
            echo "::error::Periksa tahap 'assets' di Dockerfile: npm run build harus menulis ke public/build."
          fi
          echo "::endgroup::"

          echo "::group::Izin folder yang ditulis aplikasi"
          if [ "${RUNNING}" = "true" ]; then
            docker exec "${CONTAINER}" ls -ld /var/www/html/storage /var/www/html/bootstrap/cache 2>&1 || true
          else
            echo "Container berhenti, docker exec tidak bisa dipakai."
            echo "ls -ld hanya bisa dibaca SELAMA container hidup."
            echo "Yang bisa dicek dari luar:"
            docker cp "${CONTAINER}:/var/www/html/storage/framework" "${PWD}/fw-dump" 2>/dev/null \
              && ls -ld "${PWD}/fw-dump" \
              || echo "Tidak bisa menyalin /var/www/html/storage/framework"
            rm -rf "${PWD}/fw-dump"
          fi
          echo "::endgroup::"

          echo "::group::Body respons 500"
          curl -s http://localhost:8080/pdf-to-markdown | head -c 2000
          echo
          echo "::endgroup::"

          # Apache rewrite: AH00124 (loop) hanya bisa dipahami kalau isi
          # document root dan aturan rewrite-nya benar-benar terlihat.
          in_container() {
            if [ "${RUNNING}" = "true" ]; then
              docker exec "${CONTAINER}" sh -c "$1" 2>&1
            else
              echo "Container berhenti, tidak bisa menjalankan: $1"
            fi
          }

          echo "::group::ls -la /var/www/html/public"
          in_container 'ls -la /var/www/html/public'
          echo "::endgroup::"

          echo "::group::Isi /var/www/html/public/.htaccess"
          in_container 'test -f /var/www/html/public/.htaccess && cat /var/www/html/public/.htaccess || echo ".htaccess TIDAK ADA di document root"'
          echo "::endgroup::"

          echo "::group::DocumentRoot / AllowOverride / Directory"
          in_container 'grep -rn "DocumentRoot\|AllowOverride\|<Directory" /etc/apache2/sites-enabled /etc/apache2/apache2.conf /etc/apache2/conf-enabled'
          echo "::endgroup::"

          echo "::group::mod_rewrite"
          in_container 'apache2ctl -M 2>/dev/null | grep rewrite || echo "mod_rewrite TIDAK aktif"'
          echo "::endgroup::"

          echo "::group::Port yang dipetakan"
          docker port "${CONTAINER}" || echo "Tidak ada port yang terpetakan"
          echo "::endgroup::"

      # Log juga ditampilkan saat job sukses, supaya ada jejak bahwa Apache
      # benar-benar sempat jalan dan bukan sekadar DNS yang menjawab.
      - name: Tampilkan log container
        if: always()
        run: docker logs pdf-md-smoke 2>&1 || true

      - name: Bersihkan container
        if: always()
        run: docker rm -f pdf-md-smoke || true
